<!DOCTYPE html>
<html lang="en-us">
  <head>
    <title>Sprite Tool (tldraw)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://esm.sh/tldraw/tldraw.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/scittle@latest/dist/scittle.min.js" type="application/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/scittle@latest/dist/scittle.promesa.min.js" type="application/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplify-js@1.2.4/simplify.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.1",
          "react-dom": "https://esm.sh/react-dom@19.3.1",
          "react-dom/client": "https://esm.sh/react-dom@19.3.1/client"
        }
      }
    </script>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import * as tldraw from "https://esm.sh/tldraw";

      const {
        Tldraw,
        DefaultToolbar,
        SelectToolbarItem,
        HandToolbarItem,
        DrawToolbarItem,
        EraserToolbarItem,
        LineToolbarItem,
        AssetToolbarItem,
        TldrawUiButton,
        b64Vecs,
        DefaultDashStyle,
        DefaultFillStyle,
        DefaultSizeStyle,
        getPointsFromDrawSegment,
        getIndices,
        sortByIndex,
        DefaultStylePanel,
        StylePanelSection,
        StylePanelColorPicker,
        StylePanelSizePicker,
        StylePanelButtonPicker,
        StylePanelButtonPickerInline,
        TldrawUiToolbar,
        useStylePanelContext
      } = tldraw;

      window.React = React;
      window.b64Vecs = b64Vecs;
      window.DefaultDashStyle = DefaultDashStyle;
      window.DefaultFillStyle = DefaultFillStyle;
      window.DefaultSizeStyle = DefaultSizeStyle;
      window.getPointsFromDrawSegment = getPointsFromDrawSegment;
      window.getIndices = getIndices;
      window.sortByIndex = sortByIndex;

      function CustomToolbar(props) {
        return React.createElement(
          DefaultToolbar,
          props,
          React.createElement(SelectToolbarItem, null),
          React.createElement(HandToolbarItem, null),
          React.createElement(DrawToolbarItem, null),
          React.createElement(EraserToolbarItem, null),
          React.createElement(LineToolbarItem, null),
          React.createElement(AssetToolbarItem, null),
          React.createElement(
            TldrawUiButton,
            {
              type: "tool",
              title: "Simplify selected lines (Ctrl-L)",
              onClick: () => {
                if (window.simplifySelectedLines) {
                  window.simplifySelectedLines();
                }
              }
            },
            React.createElement(
              "svg",
              {
                width: 18,
                height: 18,
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: "2",
                strokeLinecap: "round",
                strokeLinejoin: "round"
              },
              React.createElement("path", {
                d: "M12.5 21q -1.82 0 -5.458 .005a1.98 1.98 0 0 1 -1.881 -1.367l-3.064 -9.43a1.98 1.98 0 0 1 .719 -2.212l8.021 -5.828a1.98 1.98 0 0 1 2.326 0l8.021 5.828c.694 .504 .984 1.397 .719 2.212l-1.559 4.792"
              }),
              React.createElement("path", { d: "M16 19h6" })
            )
          )
        );
      }

      function CustomFillPicker() {
        const context = useStylePanelContext ? useStylePanelContext() : null;
        if (!context) return null;
        const { styles, onValueChange } = context;
        const fill = styles.get(DefaultFillStyle);
        if (fill === undefined) return null;

        const items = [
          { value: "none", icon: "fill-none", title: "Fill None" },
          { value: "solid", icon: "fill-solid", title: "Fill Fill" }
        ];

        const handleFillChange = (val) => {
          if (onValueChange) {
            onValueChange(DefaultFillStyle, val);
          } else if (window.editor) {
            window.editor.run(() => {
              window.editor.setStyleForNextShapes(DefaultFillStyle, val);
              if (window.editor.getSelectedShapeIds().length > 0) {
                window.editor.setStyleForSelectedShapes(DefaultFillStyle, val);
              }
            });
          }
        };

        const currentVal = fill && fill.type === "shared" ? fill.value : null;

        if (StylePanelButtonPicker) {
          return React.createElement(StylePanelButtonPicker, {
            title: "Fill",
            uiType: "fill",
            style: DefaultFillStyle,
            items: items,
            value: fill,
            onValueChange: (_style, val) => handleFillChange(val)
          });
        }

        if (StylePanelButtonPickerInline && TldrawUiToolbar) {
          return React.createElement(
            TldrawUiToolbar,
            { label: "Fill" },
            React.createElement(StylePanelButtonPickerInline, {
              title: "Fill",
              uiType: "fill",
              style: DefaultFillStyle,
              items: items,
              value: fill,
              onValueChange: (_style, val) => handleFillChange(val)
            })
          );
        }

        return React.createElement(
          "div",
          { className: "tlui-buttons__grid", style: { display: "flex", gap: "4px" } },
          items.map((it) =>
            React.createElement(
              TldrawUiButton,
              {
                key: it.value,
                type: "icon",
                title: it.title,
                "data-state": currentVal === it.value ? "selected" : undefined,
                onClick: () => handleFillChange(it.value)
              },
              it.title
            )
          )
        );
      }

      function CustomStylePanel(props) {
        if (!DefaultStylePanel) return null;

        return React.createElement(
          DefaultStylePanel,
          props,
          StylePanelSection && StylePanelColorPicker
            ? React.createElement(
                StylePanelSection,
                null,
                React.createElement(StylePanelColorPicker, null)
              )
            : null,
          StylePanelSection
            ? React.createElement(
                StylePanelSection,
                null,
                React.createElement(CustomFillPicker, null),
                StylePanelSizePicker
                  ? React.createElement(StylePanelSizePicker, null)
                  : null
              )
            : null
        );
      }

      const container = document.getElementById("app");
      const root = createRoot(container);

      root.render(
        React.createElement(Tldraw, {
          components: {
            Toolbar: CustomToolbar,
            StylePanel: CustomStylePanel
          },
          onMount: (editor) => {
            window.editor = editor;
            editor.setStyleForNextShapes(DefaultDashStyle, "solid");
            editor.setCurrentTool("draw");
            editor.on("event", (info) => {
              if (info.name === "pointer_up") {
                setTimeout(() => {
                  if (window.convertFinishedDraw) {
                    window.convertFinishedDraw();
                  }
                }, 0);
              }
            });
            window.dispatchEvent(new CustomEvent("tldraw-ready", { detail: editor }));
          }
        })
      );
    </script>
    <script type="application/x-scittle" src="main.cljs"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
